name: Testes dos motores de cálculo

on:
  push:
    paths:
      - 'simulador.html'
      - 'calculadora/**'
      - 'carteira/**'
      - 'data.js'
      - 'ferramentas.html'
      - 'tests/**'
      - '*.py'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe dos JS principais
        run: |
          node --check data.js
          node --check nav.js
          node --check calculadora/main.js
          node --check carteira/common.js
      - name: Testes dos motores
        run: node tests/test_motores.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências dos coletores
        run: pip install requests
      - name: Testes de limites da brapi (sem chamadas externas)
        run: python -m unittest discover -s tests -p 'test_brapi_access.py' -v

name: Dados Extras das Ações (a cada 15 dias)

on:
  schedule:
    # Dia 1 e dia 16 de cada mês, às 22h UTC (19h Brasília) — esses dados
    # (nº de acionistas, free float, tag along, governança etc.) mudam
    # pouco, não precisa rodar todo dia. Roda 1h depois do fii_extras pra
    # não disputar recursos no mesmo horário.
    - cron: '0 22 1,16 * *'
  workflow_dispatch: {}  # Permite rodar manualmente também

jobs:
  acoes-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Dependências
        run: pip install requests beautifulsoup4

      - name: Coletar dados extras das ações
        run: python fetch_acoes_extras.py

      - name: Commit e Push
        run: |
          git config user.name "Mais Valor Bot"
          git config user.email "bot@maisvalor.com"
          git add data/acoes_extras.json
          git diff --staged --quiet || git commit -m "📊 Dados extras das ações (acionistas, free float, tag along, governança)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "⚠️ Push falhou (tentativa $i/5) — aguardando 20s..."
            sleep 20
          done
